name: tests and security audit

# checks Cargo.lock against the RustSec advisory database
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # mondays 18:00 UTC: new advisories can affect an unchanged lockfile
    - cron: "0 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 tests/terminal_startup.py target/debug/nzi

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # pinned to the v7.0.1 commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # the newest cargo-audit keeps pace with the advisory database format
      - name: install cargo-audit
        run: cargo install cargo-audit --locked

      - name: audit dependencies
        run: cargo audit
